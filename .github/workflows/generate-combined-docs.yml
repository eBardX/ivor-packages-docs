name: Generate Combined Documentation
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # nightly at 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Publish combined documentation
        run: ./Scripts/publish-combined-docs.sh
      - name: Commit and push docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./docs Package.resolved
          git diff --cached --quiet || git commit -m "docs: regenerate [skip ci]"
          git push
